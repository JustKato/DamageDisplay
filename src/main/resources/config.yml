############################################################
# DamageDisplay configuration
# Colors use legacy & codes (&a, &c, &e, &7, &l, ...).
# Placeholders: {damage} {cause} {amount}
############################################################

# ----------------------------------------------------------
# Action bar (above the hotbar)
# ----------------------------------------------------------
actionbar:
  damageDealt:
    enabled: true
    format: "&e★ Damage Dealt: &e{damage}"
  damageReceived:
    enabled: true
    format: "&c☠ Damage Taken: &c{damage}&7 | &7{cause}"

# ----------------------------------------------------------
# Floating TextDisplay holograms (damage)
# ----------------------------------------------------------
displayText:
  enabled: true
  lingertime: 10          # ticks (20 = 1 second); minimum 1
  nearbyRange: 16         # skip if no players in range; 0 = disable gate
  onlyFromPlayers: false  # only when a player (or their projectile) dealt the hit
  maxTotal: 64            # global concurrent display cap (0 = unlimited)
  maxPerChunk: 8          # per-chunk concurrent cap (0 = unlimited)
  viewerScoped: true      # hide by default; show only to nearby permitted players

  format: "&c{damage}"
  critFormat: "&6✴{damage}"

  # TextDisplay appearance
  billboard: VERTICAL     # FIXED | VERTICAL | HORIZONTAL | CENTER
  shadow: true
  seeThrough: false
  background: true
  textOpacity: 255        # 0-255
  scale: 1.0

  # Float upward over the linger time
  motion:
    enabled: true
    riseBlocks: 0.6

# ----------------------------------------------------------
# Healing holograms (same style/caps/motion as displayText)
# ----------------------------------------------------------
heals:
  enabled: false
  format: "&a+{amount}"
