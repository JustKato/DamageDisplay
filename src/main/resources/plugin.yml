name: DamageDisplay
version: '${project.version}'
main: com.danlegt.damagedisplay.DamageDisplay
api-version: '26.2'
prefix: DamageDisplay
authors: [Daniel Legt <contact@danlegt.com>]
description: "A simple and efficient plugin for displaying damage events"
website: https://danlegt.com
commands:
  dd:
    description: "Main command for DamageDisplay"
    usage: "/<command> <info|help|toggle|reload>"
    aliases: [damagedisplay]
permissions:
  damagedisplay.enabled:
    default: true
    description: "Grants permission to view ActionBar messages and holograms"
  damagedisplay.command.info:
    default: op
    description: "Grants permission to /dd info"
  damagedisplay.command.toggle:
    default: true
    description: "Grants permission to /dd toggle [actionbar|heals]"
  damagedisplay.command.reload:
    default: op
    description: "Grants permission to /dd reload"
  damagedisplay.command.help:
    default: op
    description: "Grants permission to /dd help"